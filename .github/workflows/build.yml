name: Build PIXEL OS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout PIXEL-OS
        uses: actions/checkout@v4

      - name: Install image build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build xorriso squashfs-tools mtools debian-archive-keyring

      - name: Configure Debian live image
        run: |
          lb clean --purge || true
          lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --archive-areas "main contrib non-free-firmware" \
            --mirror-bootstrap https://deb.debian.org/debian \
            --mirror-chroot https://deb.debian.org/debian \
            --mirror-binary https://deb.debian.org/debian \
            --security true \
            --mirror-binary-security https://deb.debian.org/debian-security \
            --binary-images iso-hybrid \
            --debian-installer false \
            --bootappend-live "boot=live components" \
            --apt-recommends true

      - name: Configure PIXEL OS packages
        run: |
          mkdir -p config/package-lists
          cat > config/package-lists/pixel.list.chroot <<'EOF'
          systemd
          dbus
          xorg
          xserver-xorg-video-all
          lightdm
          openbox
          nodejs
          npm
          git
          curl
          ca-certificates
          fonts-dejavu
          EOF

      - name: Install PIXEL shell into image
        run: |
          mkdir -p config/includes.chroot/opt/pixel-shell
          cp -a shell/. config/includes.chroot/opt/pixel-shell/
          mkdir -p config/includes.chroot/etc/lightdm
          cat > config/includes.chroot/etc/lightdm/lightdm.conf <<'EOF'
          [Seat:*]
          autologin-user=pixel
          autologin-session=pixel
          user-session=pixel
          EOF

          mkdir -p config/includes.chroot/usr/share/xsessions
          cat > config/includes.chroot/usr/share/xsessions/pixel.desktop <<'EOF'
          [Desktop Entry]
          Name=PIXEL OS
          Comment=PIXEL OS Electron desktop
          Exec=/usr/local/bin/pixel-session
          Type=Application
          EOF

          mkdir -p config/includes.chroot/usr/local/bin
          cat > config/includes.chroot/usr/local/bin/pixel-session <<'EOF'
          #!/bin/sh
          openbox-session &
          sleep 1
          exec /opt/pixel-shell/node_modules/electron/dist/electron /opt/pixel-shell --no-sandbox --disable-gpu-sandbox
          EOF
          chmod +x config/includes.chroot/usr/local/bin/pixel-session

      - name: Configure image setup
        run: |
          mkdir -p config/hooks/live
          cat > config/hooks/live/0100-pixel.hook.chroot <<'EOF'
          #!/bin/sh
          set -e
          useradd -m -s /bin/bash pixel || true
          usermod -aG audio,video,input pixel || true
          chown -R pixel:pixel /opt/pixel-shell
          cd /opt/pixel-shell
          npm install --no-audit --no-fund
          systemctl enable lightdm.service
          systemctl set-default graphical.target
          EOF
          chmod +x config/hooks/live/0100-pixel.hook.chroot

      - name: Build bootable USB image
        run: |
          sudo lb build
          mkdir -p artifact
          cp live-image-amd64.hybrid.iso artifact/PIXEL-OS-USB.iso
          sha256sum artifact/PIXEL-OS-USB.iso > artifact/PIXEL-OS-USB.iso.sha256

      - name: Upload PIXEL OS USB image
        uses: actions/upload-artifact@v4
        with:
          name: PIXEL-OS-USB
          path: artifact/
