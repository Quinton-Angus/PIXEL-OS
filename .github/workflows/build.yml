name: Build PIXEL OS

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout PIXEL-OS
        uses: actions/checkout@v4

      - name: Checkout EDK II
        uses: actions/checkout@v4
        with:
          repository: tianocore/edk2
          path: edk2
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          cd edk2
          python -m pip install --upgrade pip
          python -m pip install -r pip-requirements.txt

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build BaseTools
        run: |
          cd edk2
          python BaseTools\Edk2ToolsBuild.py -t VS2022

      - name: Configure EDK II
        run: |
          cd edk2
          call edksetup.bat Rebuild

      - name: Copy PIXEL Package
        run: |
          xcopy PixelBootPkg edk2\PixelBootPkg /E /I /Y

      - name: Build PIXEL
        run: |
          cd edk2
          build -a X64 -b DEBUG -t VS2022 -p PixelBootPkg\PixelBoot.dsc

      - name: Find BOOTX64.EFI
        run: |
          mkdir artifact
          for /r edk2\Build %%f in (BOOTX64.EFI) do (
            copy "%%f" artifact\BOOTX64.EFI
          )

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PIXEL-EFI
          path: artifact
