name: Build PIXEL OS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-efi:
    runs-on: windows-2022

    steps:
      - name: Checkout PIXEL OS
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare EDK II
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/tianocore/edk2.git edk2
          cd edk2
          git submodule update --init --recursive
          python -m pip install --upgrade pip
          python -m pip install -r pip-requirements.txt
          set VS2026_PREFIX=%VCToolsInstallDir%
          call edksetup.bat
          python BaseTools\Edk2ToolsBuild.py -t VS2026

      - name: Build PIXEL EFI
        shell: cmd
        run: |
          cd edk2
          set VS2026_PREFIX=%VCToolsInstallDir%
          call edksetup.bat
          set PACKAGES_PATH=%CD%;%CD%\..
          set EDK_TOOLS_PATH=%CD%\BaseTools
          build -p ..\PixelBootPkg\PixelBoot.dsc -a X64 -t VS2026 -b RELEASE

      - name: Package EFI artifact
        shell: cmd
        run: |
          mkdir artifact\EFI\BOOT
          copy /Y edk2\Build\PixelBoot\RELEASE_VS2026\X64\PixelBootPkg\RELEASE\PixelBoot.efi artifact\EFI\BOOT\BOOTX64.EFI

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PIXEL-OS-Bootloader
          path: artifact
