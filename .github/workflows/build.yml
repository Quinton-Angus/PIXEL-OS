name: Build PIXEL OS (Debug)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    defaults:
      run:
        shell: cmd

    steps:

    - name: Checkout PIXEL-OS
      uses: actions/checkout@v4

    - name: Checkout EDK II
      uses: actions/checkout@v4
      with:
        repository: tianocore/edk2
        path: edk2
        submodules: recursive

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Python Requirements
      working-directory: edk2
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r pip-requirements.txt

    - name: Setup Visual Studio
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build BaseTools
      working-directory: edk2
      run: |
        python BaseTools\Edk2ToolsBuild.py -t VS2022

    - name: Configure Workspace
      working-directory: edk2
      run: |
        call edksetup.bat Rebuild
        set PACKAGES_PATH=%CD%;..

    #####################################################################
    ## EVERYTHING BELOW IS PURE DEBUGGING
    #####################################################################

    - name: Debug Environment
      working-directory: edk2
      continue-on-error: true
      run: |

        echo ========================================
        echo WORKSPACE
        echo ========================================
        echo %WORKSPACE%

        echo.
        echo ========================================
        echo PACKAGES_PATH
        echo ========================================
        echo %PACKAGES_PATH%

        echo.
        echo ========================================
        echo BUILD
        echo ========================================
        where build

        echo.
        echo ========================================
        echo BUILD.EXE
        echo ========================================
        dir /s build.exe

        echo.
        echo ========================================
        echo BaseTools Bin
        echo ========================================
        dir BaseTools\Bin /s

        echo.
        echo ========================================
        echo Python Build
        echo ========================================
        dir BaseTools\Source\Python\build /s

        echo.
        echo ========================================
        echo MdePkg Libraries
        echo ========================================
        dir MdePkg\Library

        echo.
        echo ========================================
        echo MdeModulePkg Libraries
        echo ========================================
        dir MdeModulePkg\Library

        echo.
        echo ========================================
        echo PixelBootPkg
        echo ========================================
        dir ..\PixelBootPkg /s

        echo.
        echo ========================================
        echo DSC
        echo ========================================
        type ..\PixelBootPkg\PixelBoot.dsc

        echo.
        echo ========================================
        echo INF
        echo ========================================
        type ..\PixelBootPkg\PixelBoot.inf

    #####################################################################

    - name: Build PIXEL
      working-directory: edk2
      run: |
        call edksetup.bat Rebuild
        set PACKAGES_PATH=%CD%;..
        build ^
          -a X64 ^
          -b DEBUG ^
          -t VS2022 ^
          -p ..\PixelBootPkg\PixelBoot.dsc

    - name: Upload Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug
        path: |
          edk2/Build
          edk2/Conf
