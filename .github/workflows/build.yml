name: Build PIXEL OS

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    defaults:
      run:
        shell: cmd

    steps:

    - name: Checkout PIXEL-OS
      uses: actions/checkout@v4

    - name: Checkout EDK II
      uses: actions/checkout@v4
      with:
        repository: tianocore/edk2
        path: edk2
        submodules: recursive

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip

    - name: Install EDK II Python dependencies
      working-directory: edk2
      run: |
        python -m pip install -r pip-requirements.txt

    - name: Setup Visual Studio
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build BaseTools
      working-directory: edk2
      run: |
        python BaseTools\Edk2ToolsBuild.py -t VS2022

    - name: Setup EDK II Workspace
      working-directory: edk2
      run: |
        call edksetup.bat Rebuild
        set PACKAGES_PATH=%CD%;..

    #####################################################################
    # DEBUG INFORMATION
    #####################################################################

    - name: Debug EDK II
      working-directory: edk2
      continue-on-error: true
      run: |

        echo ==========================================
        echo PATH
        echo ==========================================
        echo %PATH%

        echo.
        echo ==========================================
        echo BUILD COMMAND
        echo ==========================================
        where build

        echo.
        echo ==========================================
        echo BUILD.EXE
        echo ==========================================
        dir /s build.exe

        echo.
        echo ==========================================
        echo PYTHON BUILD
        echo ==========================================
        dir BaseTools\Source\Python\build /s

        echo.
        echo ==========================================
        echo BIN
        echo ==========================================
        dir BaseTools\Bin /s

    #####################################################################

    - name: Build PIXEL
      working-directory: edk2
      run: |
        call edksetup.bat Rebuild
        set PACKAGES_PATH=%CD%;..
        build ^
          -a X64 ^
          -b DEBUG ^
          -t VS2022 ^
          -p ..\PixelBootPkg\PixelBoot.dsc

    - name: Locate EFI
      run: |

        mkdir artifact

        for /r edk2\Build %%f in (*.efi) do (
            echo Found %%f
            copy "%%f" artifact\
        )

    - name: Upload EFI
      uses: actions/upload-artifact@v4
      with:
        name: PIXEL-EFI
        path: artifact
