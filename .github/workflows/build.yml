name: Build PIXEL OS (Debug)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    env:
      PACKAGES_PATH: ${{ github.workspace }}\edk2;${{ github.workspace }}

    defaults:
      run:
        shell: cmd

    steps:

    ###########################################################################
    # Checkout
    ###########################################################################

    - name: Checkout PIXEL-OS
      uses: actions/checkout@v4

    - name: Checkout EDK II
      uses: actions/checkout@v4
      with:
        repository: tianocore/edk2
        path: edk2
        submodules: recursive
        fetch-depth: 0

    ###########################################################################
    # Python
    ###########################################################################

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Python Requirements
      working-directory: edk2
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r pip-requirements.txt

    ###########################################################################
    # Visual Studio
    ###########################################################################

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    ###########################################################################
    # BaseTools
    ###########################################################################

    - name: Build BaseTools
      working-directory: edk2
      run: |
        python BaseTools\Edk2ToolsBuild.py -t VS2022

    ###########################################################################
    # Configure Workspace
    ###########################################################################

    - name: Configure Workspace
      working-directory: edk2
      run: |
        call edksetup.bat Rebuild

    ###########################################################################
    # DEBUG EVERYTHING
    ###########################################################################

    - name: Debug Environment
      working-directory: edk2
      continue-on-error: true
      run: |

        echo ==================================================
        echo WORKSPACE
        echo ==================================================
        echo %WORKSPACE%

        echo.
        echo ==================================================
        echo PACKAGES_PATH
        echo ==================================================
        echo %PACKAGES_PATH%

        echo.
        echo ==================================================
        echo BUILD COMMAND
        echo ==================================================
        where build

        echo.
        echo ==================================================
        echo BUILD.EXE
        echo ==================================================
        dir /s build.exe

        echo.
        echo ==================================================
        echo BaseTools Bin
        echo ==================================================
        dir BaseTools\Bin /s

        echo.
        echo ==================================================
        echo Python Build
        echo ==================================================
        dir BaseTools\Source\Python\build /s

        echo.
        echo ==================================================
        echo MdePkg
        echo ==================================================
        dir MdePkg

        echo.
        echo ==================================================
        echo MdePkg Library
        echo ==================================================
        dir MdePkg\Library

        echo.
        echo ==================================================
        echo MemoryAllocationLib
        echo ==================================================
        if exist MdePkg\Library\MemoryAllocationLib\MemoryAllocationLib.inf (
          echo FOUND
        ) else (
          echo NOT FOUND
        )

        dir /s MdePkg\Library\MemoryAllocationLib

        echo.
        echo ==================================================
        echo MdeModulePkg
        echo ==================================================
        dir MdeModulePkg

        echo.
        echo ==================================================
        echo PixelBootPkg
        echo ==================================================
        dir ..\PixelBootPkg /s

        echo.
        echo ==================================================
        echo PixelBoot.dsc
        echo ==================================================
        type ..\PixelBootPkg\PixelBoot.dsc

        echo.
        echo ==================================================
        echo PixelBoot.inf
        echo ==================================================
        type ..\PixelBootPkg\PixelBoot.inf

    ###########################################################################
    # Build
    ###########################################################################

    - name: Build PIXEL
      working-directory: edk2
      run: |
        call edksetup.bat Rebuild

        build ^
          -a X64 ^
          -b DEBUG ^
          -t VS2022 ^
          -p ..\PixelBootPkg\PixelBoot.dsc

    ###########################################################################
    # Upload Everything
    ###########################################################################

    - name: Upload Build Output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: PIXEL-Debug
        path: |
          edk2/Build
          edk2/Conf
